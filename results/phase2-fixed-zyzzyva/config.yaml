network:
  server: 127.0.0.1:9020
  units:
    - 127.0.0.1:9021
    - 127.0.0.1:9022
    - 127.0.0.1:9023
    - 127.0.0.1:9024
    - 127.0.0.1:9025
general:
  f: 1
  max-active-requests: 1000
  verbosity: v
  logfile: true # true -> file, false -> stdout
  learning: false
  report-sequence: 500
  exchange-sequence: 600
benchmark:
  block-size: 10
  checkpoint-size: 1000
  catch-up-k: 2
  request-interval-micros: 100
  benchmark-interval-ms: 3000
  timeout: fixed
  timeout-trigger-interval-ms: 50
  client: basic
  closed-loop:
    enable: true
    num-client: 50
    delay-ms: 0
  leader-rotate-interval: 50
  aggregation-delay-ms: 100
workload:
  # lower for more contention
  contention-level: 100
  dataset-size: 100
  payload:
    request-size: 4000
    reply-size: 0
  compute-factor: 0
  distribution:
    - 0 # 00
    - 0 # 04
    - 1 # 40
    - 0 # 44
  read-only-ratio: 0
fault:
  in-dark:
    affected-entities:
      - 100000
    generator:
      advance: true
      init: false
      delay: 3000
      fixed:
        value: false
  timeout:
    affected-entities:
      - 2
    generator:
      advance: true
      init: 0
      delay: 10000
      fixed:
        value: 0
  slow-proposal:
    # affected entities here are the malicious leaders
    # instead of victims of malicious leaders
    affected-entities:
      - 0
    # phase 2: off 0-180 s, on 180-360, off 360-540, on 540-720, off after 720 (times from replica start)
    attacking:
      advance: true
      init: false
      delay: 180000
      schedule:
        values:
          - true
          - false
          - true
          - false
        intervals:
          - 180000
          - 180000
          - 180000
    timer: 20
switching:
  # fixed protocol: same protocol every epoch, normal checkpointing
  debug-sequence:
    - zyzzyva
  protocol-pool:
    - pbft
    - zyzzyva
    - hotstuff
    - cheapbft
    - sbft
    - prime